<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Java Frontend + Redis</title>
</head>
<body>
    <h1>Java Frontend + Redis + MySQL</h1>
    <p>Redis fast counter: <strong th:text="${redisCount}">0</strong> visits.</p>
    <p>MySQL persisted visit log: <strong th:text="${mysqlCount}">0</strong> rows.</p>
    <p>Every request increments the Redis counter and inserts a row into MySQL.</p>
</body>
</html>
